name: Python

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    uses: svaningelgem/ci-workflows/.github/workflows/python.yml@v1
    with:
      python-versions: '["3.8", "3.9", "3.10", "3.11", "3.12"]'
      pytest-args: --cov=flashcard_generator --cov-branch --cov-fail-under=80 --cov-report=xml --cov-report=term
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Tests with coverage for Sonar
        run: |
          uv sync --locked
          uv run --no-sync pytest --cov=flashcard_generator --cov-branch --cov-report=xml

      # sonarcloud-github-action is deprecated; sonarqube-scan-action is its drop-in replacement.
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
